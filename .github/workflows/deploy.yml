name: Deploy to GitHub Pages

# Publica la web de dos maneras, para que funcione con cualquier fuente de Pages:
# - "GitHub Actions": el job `publicar` sube dist/ directo a Pages.
# - "Deploy from a branch" (gh-pages): Pages toma la copia que dejamos en la rama gh-pages.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Copia en la rama gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages

      - name: Preparar el sitio para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
