name: Keepalive

# GitHub desactiva los crons de repos que pasan 60 días sin commits.
# El tablero de pauta depende del cron de deploy.yml, así que una vez por mes dejamos un commit chiquito.
on:
  schedule:
    - cron: '17 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > pauta-pelokitos/.keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add pauta-pelokitos/.keepalive
          git commit -m "keepalive" && git push
